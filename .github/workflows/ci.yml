name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Pillow
        run: python3 -m pip install --quiet "pillow==12.2.0"

      - name: Validate pack JSON and UUIDs
        run: bash scripts/validate.sh

      - name: Syntax-check the signet script and the flight readout
        run: |
          node --check addon/behavior_pack/scripts/main.js
          node scripts/check_hud.mjs

      - name: Syntax-check the shell scripts
        run: bash -n scripts/*.sh

      - name: Generated files match the scripts
        run: |
          python3 scripts/build_dragon_model.py
          python3 scripts/build_map.py
          python3 scripts/build_textures.py
          python3 scripts/build_java_assets.py
          # Text output is byte-reproducible anywhere, so a plain diff is the right
          # gate. The textures are not, and are checked below instead.
          git diff --exit-code -- \
            addon/resource_pack/models/entity/dragon.geo.json \
            addon/behavior_pack/functions \
            java/src/main/resources/data \
            java/src/main/resources/assets/basgiath/models \
            java/src/main/resources/assets/basgiath/blockstates \
            java/src/main/resources/assets/basgiath/lang \
            java/src/main/resources/assets/basgiath/geo \
            java/src/main/resources/assets/basgiath/animations

      # Pillow hands a PNG to the platform's zlib, and macOS and Ubuntu do not agree
      # on the compressed bytes for the same image. This compares the pixels instead,
      # so the gate means "the committed art is the art the script makes" and not
      # "both machines link the same zlib".
      - name: Generated textures match the scripts
        run: python3 scripts/check_textures.py

      - name: The Java dialect is strict, and the Bedrock output did not move
        run: python3 scripts/test_editions.py

      - name: No series names in the shipped content
        run: |
          if grep -Ril \
            -e "fourth wing" -e "empyrean" -e "iron flame" -e "onyx storm" \
            -e "dragonkind" -e "tairn" -e "andarna" -e "sgaeyl" \
            -e "xaden" -e "violet sorrengail" -e "yarros" \
            addon scripts java/src; then
            echo "::error::Series name found in the shipped content"
            exit 1
          fi

      - name: Release checks
        run: python3 scripts/test_release.py

      - name: No known Bedrock schema deprecation
        run: python3 scripts/migrate_schema.py

      - name: Static world bench
        run: python3 scripts/bench_static.py

      - name: Voxel consistency metric prototype
        run: python3 scripts/check_voxel_consistency.py

      - name: Build the .mcaddon
        run: bash scripts/package.sh

  # The Bedrock edition gets the same treatment as the Java one: a live server,
  # not just a static replay. bench_bds.sh downloads the official server, unzips
  # the shipped .mcworld, boots it, and probes real blocks at known coordinates.
  # It refuses to run on macOS, which is why this never ran before — a developer
  # machine cannot run the Linux server binary, but this runner is Linux.
  bedrock-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python3 -m pip install --quiet "pillow==12.2.0"

      - name: Build the .mcworld and the .mcaddon
        run: bash scripts/package.sh

      - name: Boot the Bedrock server and probe the world
        run: bash scripts/bench_bds.sh

      # The log is the only evidence if the step above fails, and it is thrown
      # away with the runner otherwise.
      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bedrock-server-log
          path: /tmp/basgiath-bds/
          if-no-files-found: ignore

  # The only check that can see a client-side failure. A renderer registered against
  # nothing, or a model layer that will not bake, takes the game down at startup and
  # is invisible to every other job here — a dedicated server never loads any of it.
  #
  # No developer machine can run this: it needs a display, and the people who own
  # this repo play Bedrock. A virtual framebuffer on a Linux runner is the same
  # trick the mod's own users cannot do for us.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: The client starts and the mod loads
        run: |
          set -o pipefail
          # The client runs until it is killed, so this waits for the marker and then
          # stops it. A client that dies on its own stops the wait early, which is
          # what makes a startup crash fail this step instead of hanging it.
          xvfb-run -a ./gradlew runClient --no-daemon > /tmp/client.log 2>&1 &
          CLIENT=$!
          for _ in $(seq 1 60); do
            grep -q "BASGIATH CLIENT READY" /tmp/client.log && break
            kill -0 "$CLIENT" 2>/dev/null || break
            sleep 5
          done
          pkill -f net.neoforged.devlaunch 2>/dev/null || true
          kill "$CLIENT" 2>/dev/null || true
          wait "$CLIENT" 2>/dev/null || true

          if grep -q "BASGIATH CLIENT READY" /tmp/client.log; then
            echo "the client started and the mod loaded"
            exit 0
          fi
          echo "::error::the client never reported ready"
          grep -iE "exception|error|caused by|failed" /tmp/client.log | head -40 || true
          exit 1

      - name: Keep the client log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minecraft-client-log
          path: /tmp/client.log
          if-no-files-found: ignore

  # The Java port is a separate toolchain. This job runs Gradle and nothing else.
  # The validate job above runs the Python chain and never runs Gradle.
  # Neither job calls the other. See docs/JAVA-PORT-PROMPT.md.
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the Java mod
        run: ./gradlew build

      # Raises the college and summons the dragon on a headless server, then stops.
      # This is the check that catches a generated function the game refused to load,
      # which is silent in every other check. The assertion is anchored to the whole
      # result line so a partial or malformed line cannot read as a pass.
      - name: The port works on a live server
        run: |
          set -o pipefail
          ./gradlew runSmoke --no-daemon | tee /tmp/smoke.log
          grep -qE "^SMOKE RESULT  passed=[0-9]+ failed=0$" /tmp/smoke.log
