# Basgiath — Java port. Toolchain and mod metadata.
# Everything here is inside java/. The Bedrock chain reads none of it.

# Gradle daemon settings. The game runs get their own memory via the run configs.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment — target chosen 2026-10-06 and held. Do not chase drops.
# NeoForge 21.1.x is the long-lived line for Minecraft 1.21.1.
# Latest NeoForge releases: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.256
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## GeckoLib — the dragon's model and animation runtime.
# Releases: https://modrinth.com/mod/geckolib/versions
geckolib_artifact=geckolib-neoforge-1.21.1
geckolib_version=4.9.3

## Mappings — official Mojang (Mojmap). Never Yarn.
# Parchment only layers parameter names and javadoc on top of the official names.
# Releases: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod properties
# Keep the series name, the book titles, and character names out of every shipped
# string. docs/IP-RULES.md wins on any conflict.
mod_id=basgiath
mod_name=Basgiath
mod_license=All Rights Reserved
mod_version=0.1.0
# Modrinth version channel: alpha, beta, or release. Beta until a client has run it.
mod_version_type=beta
mod_group_id=com.basgiath
mod_authors=Cemini23
mod_description=Raises the college, the span, and a bondable dragon on Java, from the same generator that builds the Bedrock map.
